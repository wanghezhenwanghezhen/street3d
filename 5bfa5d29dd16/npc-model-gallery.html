const d=await fetch('./data/npc-day-r20.json').then(r=>r.json()),canvas=document.getElementById('gallery'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor('#eee8f1');const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-3.8,3.8,2.5,-2.5,.1,20);camera.position.set(0,0,10);scene.add(new THREE.HemisphereLight('#ffffff','#8d9dba',2.6));const light=new THREE.DirectionalLight('#ffffff',2);light.position.set(-3,5,5);scene.add(light);const models=createNpcModels({scene,profiles:d.profiles,interactables:[]}),labels=d.profiles.map((p,i)=>{const e=document.createElement('div');e.className='label';e.textContent=p.name+(!p.appearance?' · 火柴人':'');document.getElementById('labels').append(e);return e;});
